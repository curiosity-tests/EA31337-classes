name: Test Account

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
    - 'Account/**.h'
    - '.github/workflows/test-account.yml'
  push:
    paths:
    - 'Account/**.h'
    - '.github/workflows/test-account.yml'

jobs:

  Account-Tests-MQL4:
    defaults:
      run:
        shell: bash
        working-directory: Account/tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
        - Account.test
        - AccountForex.test
        - AccountMt.test
    steps:
    - uses: actions/download-artifact@v2
      with:
        name: files-ex4
    - name: Run ${{ matrix.test }}
      uses: fx31337/mql-tester-action@master
      with:
        Script: ${{ matrix.test }}
    timeout-minutes: 10
