name: Test Exchange

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
    - 'Exchange/**.h'
    - 'Exchange/**.mq?'
    - '.github/workflows/test-exchange.yml'
  push:
    paths:
    - 'Exchange/**.h'
    - 'Exchange/**.mq?'
    - '.github/workflows/test-exchange.yml'

jobs:

  Exchange-Tests-MQL4:
    defaults:
      run:
        shell: bash
        working-directory: Exchange/tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
        - Exchange.test
    steps:
    - uses: actions/download-artifact@v2
      with:
        name: files-ex4
    - name: Run ${{ matrix.test }}
      uses: fx31337/mql-tester-action@master
      with:
        Script: ${{ matrix.test }}
    timeout-minutes: 10
