name: Test

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
    - '**.h'
    - '*.mq?'
    - '**.mq?'
    - '**/*.mq?'
    - '.github/workflows/test.yml'
  push:
    paths:
    - '**.h'
    - '*.mq?'
    - '**.mq?'
    - '**/*.mq?'
    - '.github/workflows/test.yml'

jobs:

  Experts-MQL4:
    defaults:
      run:
        shell: bash
        working-directory: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
        - BufferStructTest
        - BufferTest
        - ChartTest
        - CompileIndicatorsTest
        - DatabaseTest
        - DrawIndicatorTest
        - EATest
        - IndicatorDataTest
        - IndicatorTest
        - IndicatorsTest
        - MailTest
        - MarketTest
        - MatrixTest
        - OrderTest
        - OrdersTest
        - StatsTest
        - StrategyTest
        - StrategyTest-RSI
        - SymbolInfoTest
        - SummaryReportTest
        - TickerTest
        - TradeTest
    steps:
    - uses: actions/download-artifact@v2
      with:
        name: files-ex4
    - name: Run ${{ matrix.test }}
      uses: fx31337/mql-tester-action@master
      with:
        BtDays: 1-8
        BtMonths: 1
        BtYears: 2020
        MtVersion: 4.0.0.1359
        TestExpert: ${{ matrix.test }}
    timeout-minutes: 10

  Scripts-MQL4:
    defaults:
      run:
        shell: bash
        working-directory: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
          #  - 3DTest
        - ConfigTest
        - ConvertTest
        - DateTimeTest
        - DictTest
        - LogTest
        - MD5Test
        - MathTest
        - OrderQuery
        - ProfilerTest
        - RefsTest
        - SerializerTest
        - TerminalTest
        - TimerTest
        - ValueStorageTest
    steps:
    - uses: actions/download-artifact@v2
      with:
        name: files-ex4
    - name: Run ${{ matrix.test }}
      uses: fx31337/mql-tester-action@master
      with:
        Script: ${{ matrix.test }}
    timeout-minutes: 10

  Scripts-MQL4-Ignore:
    defaults:
      run:
        shell: bash
        working-directory: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
          # @fixme: GH-266
        - RedisTest
          # @fixme: GH-266
        - WebTest
    steps:
    - uses: actions/download-artifact@v2
      with:
        name: files-ex4
    - name: Run ${{ matrix.test }}
      uses: fx31337/mql-tester-action@master
      with:
        Script: ${{ matrix.test }}
        RunOnFail: "exit 0"
    timeout-minutes: 10

  Trade-Tests-MQL4:
    defaults:
      run:
        shell: bash
        working-directory: Trade/tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
        - TradeSignalTest
    steps:
    - uses: actions/download-artifact@v2
      with:
        name: files-ex4
    - name: Run ${{ matrix.test }}
      uses: fx31337/mql-tester-action@master
      with:
        Script: ${{ matrix.test }}
    timeout-minutes: 10
